name: Legacy 0.1 Release

on:
  push:
    tags:
      - "v0.1.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 0.2 packages are built and verified separately; never upload legacy dist for them.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v0.1.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          NOTES=".github/releases/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_NOTE.md
          else
            echo "## Changelog" > RELEASE_NOTE.md
            git-cliff $RANGE --tag ${{ github.ref_name }} >> RELEASE_NOTE.md
            echo "" >> RELEASE_NOTE.md
            if [ -f ".github/RELEASE_FOOTER.md" ]; then
              cat .github/RELEASE_FOOTER.md >> RELEASE_NOTE.md
            fi
          fi

          # 设置输出变量（给后续 step 用）
          {
            echo "release_body<<EOF"
            cat RELEASE_NOTE.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release_body }}
          files: |
            dist/*.dll
            dist/*.me
            dist/*.rar
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
